Ticks is an option for graphics functions that specifies tick marks for axes. Ticks -> None specifies that no tick marks should be given. Ticks -> Automatic specifies that tick marks should be chosen automatically. They are usually placed at points whose coordinates have the minimum number of digits in their decimal representation. Ticks -> {xticks, yticks} specifies tick marks for different axes. Each specification is None, Automatic, or an explicit list of tick mark positions. Ticks can be used in both two- and three-dimensional graphics.
