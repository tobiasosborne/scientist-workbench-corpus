OpenAppend["file"] opens a file to append output to it. The following options can be given: FormatType InputForm default format for printing expressions GraphicsFont "DefaultFont" default font for text in graphics output PageHeight 22 number of lines per page PageWidth 78 number of character widths per line TextRendering Plain type of text output TotalHeight Infinity maximum number of lines for a single expression TotalWidth Infinity maximum number of character widths for a single expression Files are specified by their names. Only one file with a particular name can be open at once. On computer systems that support pipes, OpenAppend"!command"] runs the external program specified by command, and opens a pipe to send input to it. If OpenAppend succeeds in opening a particular file or pipe, it returns the name of the file or pipe. Otherwise, it generates a message, and returns Null. OpenAppend resolves file names according to the procedure described in Section ??. The list $$Media gives names of all the files and pipes active at a particular time. ResetMedium can be used to change the properties of a file or pipe, after it is already open. Functions like Put and Write automatically open the files or pipes they need, if they are not already open.
'''

