Options[symbol] gives the list of default options assigned to a symbol. Options[f x, y, … , name1 -> value1 , … ]] gives the options explicitly specified in a particular expression. Many built-in functions allow you to give additional arguments that specify options with rules of the form name -> value. Optionsf ] gives the list of rules to be used for the options associated with a function f if no explicit rules are given when the function is called. Options[always returns a list of transformation rules for option names. You can assign a value to Optionssymbol] to redefine all the default option settings for a function. SetOptionssymbol, name -> value] can be used to specify individual default options. See pages 113 and 564.
'''

