Fit[data, funs, vars] finds a least-squares fit to a list of data as a linear combination of the functions funs of variables vars. The data can have the form {{x1 , y1 , … , f1 }, {x2 , y2 , … , f2 }, … }, where the number of coordinates x, y, ... is equal to the number of variables in the list vars. The data can also be of the form {f1 , f2 , … }, with a single coordinate assumed to take values 1, 2, .... The argument funs can be any list of functions that depend only on the objects vars. Fit[{f1, f2 , … }, {1, x, x^2}, x] gives a quadratic fit to a sequence of values fi . The result is of the form a0 + a1 x + a2 x^2, where the ai are real numbers. The successive values of x needed to obtain the fi are assumed to be 1, 2, .... Fit[{{x1, f1 }, {x2, f2 }, … }, {1, x, x^2}, x] does a quadratic fit, assuming a sequence of x values xi . Fit[{{x1, y1 , f1 }, … }, {1, x, y}, {x, y}] finds a fit of the form a0 + a1 x + a2 y. Fit[data, {{fn1 , fn2 , … }, {fd1 , … }}, vars] fits the data to rational function of the form (an1 fn1 + an2 fn2 + … ) / (ad1 fd1 + … ). Fit always finds the linear combination of the functions in the list forms that minimizes the sum of the squares of deviations from the values fi .
'''

