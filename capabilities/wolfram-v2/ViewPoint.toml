[description]
md = '''
ViewPoint is an option for Graphics3D and SurfaceGraphics which gives the point in space from which the objects plotted are to be viewed. ViewPoint -> {x, y, z} gives the position of the viewpoint relative to the center of the three-dimensional box that contains the object being plotted. The coordinates are scaled so that the longest side of the box has length 1. Common settings for ViewPoint are: {0, -2, 0} directly in front {0, -2, 2} in front and up {0, -2, -2} in front and down {-2, -2, 0} left-hand corner {2, -2, 0} right-hand corner {0, 0, 2} directly above Choosing ViewPoint further away from the object reduces the distortion associated with perspective.
'''

