md = '''
TotalHeight is an option for OpenWrite etc. and ResetMedium which specifies the maximum number of lines of text that should be printed for each output expression. Short forms of expressions are given if the number of lines needed to print the whole expression is too large. With TextRendering -> Plain, TotalHeight bounds the actual numbers of lines generated. With TextRendering -> PostScript, TotalHeight bounds the number of em spaces (number of times the width of an m character). TotalHeight -> Infinity allows expressions of any length to be printed.
