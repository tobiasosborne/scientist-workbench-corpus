a.b.c or Dota, b, c] gives products of vectors, matrices and tensors. a.b gives an explicit result when a and b are lists with appropriate dimensions. It contracts the last direction in a with the first direction in b. Various applications of Dot: {a1 , a2 } . {b1 , b2 } scalar product of vectors {a1 , a2 } . {{m11 , m12 }, {m21 , m22 }} product of a vector with a matrix {{m11 , m12 }, {m21 , m22 }} . {a1, a2 } product of a matrix with a vector {{m11 , m12 }, {m21 , m22 }} . {{n11 , n12 }, {n21 , n22 }} product of two matrices Example: {a, b} . {c, d} ;;!a c + b d. {{a, b}, {c, d}} . {x, y} The result of applying Dot to two tensors Ti1 i2 … in and Uj1 j2 … jm is the tensor k P ;;! {a x + b y, c x + d y}. Ti1 i2 … in;1k Ukj2 … jm . Dot effectively contracts the last index of the first tensor with the first index of the second tensor. Applying Dot to a rank n tensor and a + ; rank m tensor gives a rank n m 1 tensor. When its arguments are not lists, Dot remains unevaluated. It has the attribute Flat. See pages 94 and 442.
'''

