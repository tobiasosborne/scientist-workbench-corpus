Release[expr] causes expr to be evaluated, removing any “holding”. Release[can be used to override the “holding” of function arguments. When Release expr] appears as the argument of the function, that argument is immediately replaced by the evaluated form of expr, whether or not the attributes associated with the function specified that the argument should be held. When Release[is applied to an expression that is not a held function argument, it returns the expression with subexpressions of the form Hold e] replaced by the evaluated form of e.
