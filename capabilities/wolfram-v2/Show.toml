[description]
md = '''
Show[graphics, options] displays two- and three-dimensional graphics, possibly with options changed. Show[g1 , g2 , … ] shows several plots combined. Show can be used with Graphics, Graphics3D, SurfaceGraphics, ContourGraphics and DensityGraphics. Options explicitly specified in Show override those included in the graphics expression. Only plots based on Graphics and Graphics3D can be combined. When plots are combined, their lists of non-default options are concatenated. Show is effectively the analog of Print for graphics. The option DisplayFunction determines the actual output mechanism used. Functions like Plot automatically apply Show to the graphics expressions they generate. See pages 113 and 140. See also: Plot, etc., and Display.
'''

