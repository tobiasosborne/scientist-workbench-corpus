Debug[expr] evaluates expr, allowing you to stop at function calls and in control structures. Debug[expr, {f1 , f2 , … }] stops only in evaluation of the functions fi. The following actions are possible in Debug: inspect (i) inspect current state step (s) step through the execution of the current expression next (n) continue to the next expression (default action) continue (c) continue to the end of the current control structure finish (f) continue to the end of the whole computation abort (a) abort the computation When you inspect the current state, you can look at the values of any objects. However, you cannot perform any operation which assigns values. Quit ] or Exit ] exits the inspector.
'''

