Display[channel, graphics] writes graphics to the specified output channel. The output channel can be a single file or pipe, or a list of them. Display writes graphics in PostScript form. The graphics in Display can be Graphics, Graphics3D, SurfaceGraphics, ContourGraphics or DensityGraphics. The PostScript produced by Display does not include initialization or termination commands, nor does it include text font definitions. $DisplayFunction is usually given in terms of Display. If any of the specified files or pipes in channel are not open, Display uses OpenWrite to open them, then closes these particular files or pipes when it has finished.
