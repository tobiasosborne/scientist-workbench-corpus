[description]
md = '''
$RecursionLimit gives the current limit on the number of levels of recursion that Mathematica can use. $RecursionLimit=n sets the limit on the number of recursion levels that Mathematica can use to be n. $RecursionLimit=Infinity removes any limit on the number of recursion levels. Each time the evaluation of a function requires the nested evaluation of the same or another function, one recursion level is used up. On most computers, each level of recursion uses a certain amount of stack space. $RecursionLimit allows you to control the amount of stack space that Mathematica can use from within Mathematica. On some computer systems, your whole Mathematica session may crash if you allow it to use more stack space than the computer system allows. MemoryInUse and related functions do not count stack space. See pages 223, 320, 571 and 577.
'''

