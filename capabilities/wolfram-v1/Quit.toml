Quit ] terminates a Mathematica session, or an inspection session initiated within Debug. All definitions that you have not explicitly saved in files are lost when the Mathematica session terminates. Before terminating a session, Mathematica executes any delayed value that has been assigned to the global variable $Epilog. Conventionally, this attempts to read in a file end.m of commands to be executed before termination. On most computer systems, Quitn] terminates Mathematica, passing the integer n as an exit code to the operating system. Exit is a synonym for Quit.
'''

