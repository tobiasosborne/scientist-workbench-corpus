TotalWidth is an option for OpenWrite etc. and ResetMedium which specifies the maximum total number of characters of text that should be printed for each output expression. Short forms of expressions are given if the number of characters needed to print the whole expression is too large. With TextRendering -> Plain, TotalWidth bounds the actual numbers of characters generated. Line breaks are not counted. With TextRendering -> PostScript, TotalWidth bounds the number of em spaces (number of times the width of an m character). TotalWidth -> Infinity allows expressions of any length to be printed.
