Partition[list, n] partitions list into non-overlapping sublists of length n. Partition[list, n, di] generates sublists with offset di. Example: Partition[{a,b,c,d,e,f}, 2] ;;! {{a, b}, {c, d}, {e, f}}. All the sublists generated by Partition[list, n, di] are of length n. As a result, some elements at the end of list may not appear in any sublist. The element e in Partition[{a,b,c,d,e}, 2] ;;! {{a, b}, {c, d}} is dropped. Partition[{a,b,c,d,e}, 3, 1] ;;! {{a, b, c}, {b, c, d}, {c, d, e}} generates sublists with offset 1. The object list need not have head List. Partition[f a,b,c,d], 2] ;;! f f a, b], f c, d]].
'''

