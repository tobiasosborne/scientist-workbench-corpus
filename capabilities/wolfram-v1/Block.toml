Block[{x1 , x2 , … }, expr] specifies that expr is to be evaluated with the symbols xi taken as local variables. Block[{x1 = v1 , … }, expr] defines initial values for local variables. The initial values specified for local variables are found before the variables are “localized”. As a result, the initial values of different local variables are therefore effectively assigned in parallel. A local variable x is represented by the same symbol as a global x. The two are considered identical in pattern matching or == comparisons. Any values of the global x are, however, removed when the local x is created, and are restored when the local x is destroyed. Block has attribute HoldAll.
