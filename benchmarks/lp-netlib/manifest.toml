[meta]
name        = "lp-netlib"
domain      = "optimisation"
description = """
The small-NETLIB-LP subset (21 problems with n_canonical × m_canonical
≤ 100,000 entries), ingested into canonical SCS form (ADR-0030 §C:
min cᵀx s.t. Ax = b, x ∈ NonNegCone) and graded against a dual-witness
oracle (Gurobi 13.0.1 + Mosek 11.1.6).

The 21 problems are the classical tractable NETLIB battery: afiro,
adlittle, sc50a/b, sc105, sc205, scsd1, share1b/2b, blend, beaconfd,
israel, lotfi, recipe, brandy, bore3d, boeing2, forplan, kb2, scagr7,
stocfor1.  The full 114-problem NETLIB collection is downloaded
locally to data/lp-netlib/raw/; the 88 problems above the DENSE_LIMIT
gate (100,000 entries) are deferred to v0.2 when the sparse wire
format lands (ADR-0030 §"Open questions #5").

Per-problem invariants enforce primal/dual feasibility, complementary
slackness, optimality gap, and oracle agreement — the four KKT
residuals plus the consensus check.  Twelve checks per case (10 KKT
+ 2 certificate-path checks shared with lp-small).

Phase 0 of the convex-cone solver epic (scientist-workbench-eg9j,
ADR-0030 §F).  Sibling: lp-small/ covers the 10-100 var
pathology battery.
"""
ported_from = "scientist-workbench-corpus (new; not a port)"

[verifier]
kind = "bun"
cmd  = "bun"
args = ["run", "${SUITE_ROOT}/golden/verify.ts"]

[[verifier.checks]]
name             = "shape"
description      = "Candidate record has the seven required fields with correct types; tagged envelopes carry a known tag and a payload record."
tolerance_source = "structural — no tolerance"

[[verifier.checks]]
name             = "finite_entries"
description      = "x, dual, slack, objective, achieved_precision contain no NaN and no ±Inf. (A correctly refused case skips this check.)"
tolerance_source = "structural — no tolerance"

[[verifier.checks]]
name             = "status_consistency"
description      = "Candidate status ∈ {optimal, infeasible, unbounded, iter-cap, numerical-breakdown} and agrees with the consensus status from expected.json."
tolerance_source = "structural — no tolerance"

[[verifier.checks]]
name             = "primal_feasibility"
description      = "‖A·x − b‖_∞ ≤ 1e-8 · max(1, ‖b‖_∞).  Wright 1997 §2.4 KKT residual r_p."
tolerance_source = "Wright 1997 §2.4 + 1e-8 relative"

[[verifier.checks]]
name             = "primal_nonneg"
description      = "x_i ≥ −1e-8 for every i in any NonNegCone slice.  The −ε allowance absorbs round-off; truly negative entries indicate a contract violation."
tolerance_source = "Wright 1997 §2.4 + 1e-8 absolute"

[[verifier.checks]]
name             = "dual_feasibility"
description      = "‖Aᵀ·y + s − c‖_∞ ≤ 1e-8 · max(1, ‖c‖_∞) and s_i ≥ −1e-8.  Wright 1997 §2.4 KKT residual r_d."
tolerance_source = "Wright 1997 §2.4 + 1e-8 relative"

[[verifier.checks]]
name             = "complementary_slackness"
description      = "|xᵀ·s| ≤ 1e-8 · max(1, |cᵀ·x|).  Wright 1997 §2.4 KKT residual r_c."
tolerance_source = "Wright 1997 §2.4 + 1e-8 relative"

[[verifier.checks]]
name             = "optimality_gap"
description      = "|cᵀ·x − bᵀ·y| ≤ 1e-8 · max(1, |cᵀ·x|).  The duality gap derived from the candidate's own (x, y)."
tolerance_source = "Wright 1997 §2.4 + 1e-8 relative"

[[verifier.checks]]
name             = "oracle_agreement"
description      = "|candidate.objective − consensus.objective| ≤ 1e-8 · max(1, |consensus.objective|).  Only checked when expected.consensus.agreement is true.  When Gurobi and Mosek themselves disagreed, the case is flagged oracle_disagreement and dropped from the gating set."
tolerance_source = "consensus snapshot ± 1e-8 relative"

[[verifier.checks]]
name             = "self_reported_precision"
description      = "Candidate's achieved_precision is within 2× of the verifier's recomputation of max(r_p, r_d, r_c) — captures order-of-magnitude lies while tolerating float64 summation-order drift between Python adapter and TS verifier."
tolerance_source = "claimed ≥ recomputed / 2; honest-scope per CLAUDE.md Rule 8"

[[verifier.checks]]
name             = "infeasibility_certificate"
description      = "For status=infeasible cases: candidate's dual is a Farkas certificate (Aᵀy ≤ 1e-8, bᵀy > 1e-8 in either sign). NETLIB problems are all well-posed so this passes by N/A; shared check with lp-small."
tolerance_source = "Farkas lemma + 1e-8 absolute"

[[verifier.checks]]
name             = "unboundedness_certificate"
description      = "For status=unbounded cases: candidate's x is an unbounded direction (Ad=0, d≥0, cᵀd<0). NETLIB problems are all well-posed so this passes by N/A; shared check with lp-small."
tolerance_source = "duality of infeasibility + 1e-8 absolute"

[golden]
inputs           = "golden/inputs.json"
inputs_sha256    = "df163720f26af2c231584b9501ff56bdc16ed5fea3a83e9c3053e2322df6ab24"
expected         = "golden/expected.json"
