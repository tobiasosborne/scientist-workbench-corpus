# =============================================================================
# gamma-anchor -- wolfram replay adapter (gold tier)
# =============================================================================
#
# Grades Wolfram's `N[Gamma[z], 60]` (and the 18 other Gamma-family
# heads) outputs (committed snapshot, scientist-workbench bench bead
# scientist-workbench-ehi4, 2026-05-19) against the 3-gold consensus.
# Pre-computed-oracle pattern (see B19's besselj-anchor wolfram adapter
# for the design notes).
#
# Wolfram succeeded on 369/377 cases; the 8 "refused" cases are L17
# exact poles where Wolfram returned ComplexInfinity (the same 8
# inputs all three golds refuse).  Surfaced as oracle/wolfram-refused
# tagged envelopes.

[adapter]
target          = "wolfram"
capability_id   = "gamma-anchor"
cmd             = "bun"
args            = ["run", "${CORPUS_ROOT}/adapters/wolfram/oracles/gamma-anchor-replay.ts"]
version         = "WolframScript 1.13.0 / Kernel 14.3.0 (snapshot 2026-05-19)"
platform_pinned = false
