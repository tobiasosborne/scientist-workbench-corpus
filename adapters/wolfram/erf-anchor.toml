# =============================================================================
# erf-anchor — wolfram replay adapter (gold tier)
# =============================================================================
#
# Grades Wolfram's `N[Erf[z], 60]` outputs (committed snapshot, bead
# scientist-workbench-ufgd, 2026-05-16) against the gold-tier consensus.
# The candidate is the replay shim, NOT live wolframscript — corpus is a
# self-contained artefact (recon spec, bead scientist-workbench-corpus-fpn).
#
# Wolfram refused 0/271 cases.  When graded against the gold-only
# consensus, this oracle "candidate" will pass the 264 in-consensus cases
# (consensus.value = wolfram's value, so rel_err = 0); the 7 disagreement
# cases will hit consensus_exists=warn and skip the value_matches check.

[adapter]
target          = "wolfram"
capability_id   = "erf-anchor"
cmd             = "bun"
args            = ["run", "${CORPUS_ROOT}/adapters/wolfram/oracles/erf-anchor-replay.ts"]
version         = "WolframScript 1.13.0 / Kernel 14.3.0 (snapshot 2026-05-16)"
platform_pinned = false
