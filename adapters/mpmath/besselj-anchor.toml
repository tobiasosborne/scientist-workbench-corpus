# =============================================================================
# besselj-anchor — mpmath replay adapter (gold tier)
# =============================================================================
#
# Grades mpmath's `besselj/y/i/k` outputs at 60 dps (committed snapshot,
# bead area scientist-workbench-qccc, 2026-05-17) against the 3-gold
# consensus.  Pre-computed-oracle pattern (see B18's erf-anchor mpmath
# adapter for the design notes).
#
# mpmath succeeded on 1729/1766 cases.  36 honest-special-tokens (T6
# edge: BesselJ(ν, +∞)→0 etc.) and 1 timeout (T7-besselk-020 at 30s)
# normalised to output=null and surfaced as `oracle/mpmath-refused`
# tagged envelopes.

[adapter]
target          = "mpmath"
capability_id   = "besselj-anchor"
cmd             = "bun"
args            = ["run", "${CORPUS_ROOT}/adapters/mpmath/oracles/besselj-anchor-replay.ts"]
version         = "mpmath 1.3.0 / python 3.12.3 (snapshot 2026-05-17)"
platform_pinned = false
