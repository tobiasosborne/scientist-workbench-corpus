[adapter]
# INERT adapter — see lp-netlib.toml in this directory for the activation
# protocol.  Same target tool (lp-solve / cone-solve); different bench
# suite (lp-small).
target          = "scientist-workbench"
capability_id   = "lp-small"
cmd             = "bun"
args            = ["run", "${SUITE_ROOT}/run-candidate.ts"]
cwd             = "${WORKBENCH_ROOT}"
version         = "PENDING-tools/lp-solve"
platform_pinned = true
