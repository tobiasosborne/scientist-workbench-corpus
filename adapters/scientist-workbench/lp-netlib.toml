# Bridges raw JSON <-> canonical Value protocol and invokes
# wb.run(CANDIDATE_TOOL, ...). Defaults to CANDIDATE_TOOL=lp-solve;
# override via env to A/B against tools/cone-solve when it ships.

[adapter]
target          = "scientist-workbench"
capability_id   = "lp-netlib"
cmd             = "bun"
args            = ["run", "${SUITE_ROOT}/run-candidate.ts"]
cwd             = "${WORKBENCH_ROOT}"
version         = "git@9efb8d7"
platform_pinned = true
