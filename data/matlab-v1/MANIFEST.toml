# MANIFEST.toml — provenance for matlab-v1 ground-truth source
#
# The 1984 PC-MATLAB v1.0 release predates redistributable digital media;
# the surviving canonical record is two posts on Cleve Moler's Cleve's
# Corner blog. The first post reproduces the complete v1.x HELP listing
# inline, which is the load-bearing artefact for ingestion. Both posts
# are fetched via the Wayback Machine to get a stable archive form
# (the live blog is behind bot-detection and rejects scripted clients).

[meta]
system        = "matlab"
version       = "1"
description   = "PC-MATLAB v1.0 (1984) — first MathWorks commercial MATLAB release, IEEE Conference on Decision and Control debut. Reference HELP listing reproduced in Cleve Moler's 2018 blog post; the original Fortran-MATLAB Users' Guide (1981) discussed in the companion post."
retrieved_at  = "2026-05-06"
retrieved_by  = "manual curl via Wayback Machine"

