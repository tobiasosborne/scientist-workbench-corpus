sha256_ledger        = "raw/sha256.sum"
sha256_ledger_sha256 = "8317e72985fd00fc25bf137d21f3a74a70ef1cde40f61b2ea781b8400584d78c"
total_files          = 2
total_size_bytes     = 611774

